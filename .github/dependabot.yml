version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 15
    target-branch: master
    versioning-strategy: increase
    labels:
      - dependencies
    groups:
      types:
        dependency-type: development
        patterns:
          - "@types/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 10
    target-branch: master
    labels:
      - DevOps
