name: Node.js CI

on:
  pull_request:
    branches: [ "master" ]
  push:

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - run: corepack enable yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint and formatting check
        run: yarn run lint

      - name: Build with source maps
        run: yarn run build

      - name: Upload build
        uses: actions/upload-artifact@v7

        with:
          name: build
          path: |
            lib/**/*.js
            lib/**/*.js.map
            lib/**/*.d.ts
            test/**/*.js
            test/**/*.js.map

  test:

    runs-on: ubuntu-latest

    needs: build

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:

      - name: 'Checkout the repository'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js for dependency installation
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - run: corepack enable yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build

      - name: Set up runtime under test
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test compiled JavaScript with Node.js ${{ matrix.node-version }}
        run: node node_modules/mocha/bin/mocha.js

  coverage:

    name: Coverage with Node.js 24
    runs-on: ubuntu-latest

    needs: build

    permissions:
      contents: read
      id-token: write

    steps:

      - name: 'Checkout the repository'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - run: corepack enable yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build

      - name: Generate mapped LCOV from TypeScript sources
        run: yarn run test-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
